<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Training Schedule | EasyLatih</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .container { max-width: 1100px; margin: auto; padding: 2rem; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .schedule-table { width: 100%; border-collapse: collapse; min-width: 720px; }
    .schedule-table th, .schedule-table td { padding: .85rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    .schedule-table thead th { background: #0f172a; color: #fff; font-weight: 700; }
    .filter-bar { margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
    .filter-bar label { font-weight: 600; }
    .filter-bar select { padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
    @media (max-width: 640px) {
      .schedule-table { min-width: 0; }
      .schedule-table thead { display: none; }
      .schedule-table, .schedule-table tbody, .schedule-table tr, .schedule-table td { display: block; width: 100%; }
      .schedule-table tr { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: .5rem .75rem; margin-bottom: .75rem; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
      .schedule-table td { border: none; padding: .45rem 0; }
      .schedule-table td::before { content: attr(data-label); display: block; font-size: .8rem; color: #6b7280; margin-bottom: .15rem; }
      .schedule-table td:last-child { margin-top: .25rem; }
    }
  </style>
</head>
<body>
  <!-- header omitted for brevity -->
  <section class="container">
    <h2 class="section-title">Upcoming Sessions</h2>
    <p>This schedule is loaded from Google Sheets. Each row now includes a link to its Google Drive folder.</p>

<div class="filter-bar">
  <label for="venueFilter">Filter by location:</label>
  <select id="venueFilter"><option value="all">All Locations</option></select>
</div>
<div class="table-responsive">
  <table class="schedule-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Course</th>
        <th>Duration</th>
        <th>Delivery Method</th>
        <th>Venue</th>
        <th>Details</th>
        <th>Register</th>
      </tr>
    </thead>
    <tbody id="scheduleBody"></tbody>
  </table>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRfdHRk3MuhF-IUKOdDwU3ahbODmSHRuolZkAPWRhxscEGAX0YMKJA5L49yhieYv4fpBEo97Rm1kiqZ/pub?gid=0&single=true&output=csv'; // ganti dengan URL CSV dari Google Sheet
    const tableBody  = document.getElementById('scheduleBody');
    const venueSelect = document.getElementById('venueFilter');

    function parseCSV(csv) {
      const lines = csv.trim().split(/\\r?\\n/);
      const rows  = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        rows.push({
          date: cols[0],
          course: cols[1],
          duration: cols[2],
          method: cols[3],
          venue: cols[4],
          details: cols[5],
          register: cols[6]
        });
      }
      return rows;
    }

    function populateTable(data) {
      tableBody.innerHTML = '';
      const venues = new Set();
      data.forEach(item => venues.add(item.venue));
      if (venueSelect.options.length === 1) {
        Array.from(venues).sort().forEach(v => {
          const opt = document.createElement('option');
          opt.value = v; opt.textContent = v;
          venueSelect.appendChild(opt);
        });
      }
      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.dataset.venue = item.venue;
        tr.innerHTML = \`
          <td data-label="Date">\${item.date}</td>
          <td data-label="Course">\${item.course}</td>
          <td data-label="Duration">\${item.duration}</td>
          <td data-label="Delivery Method">\${item.method}</td>
          <td data-label="Venue">\${item.venue}</td>
          <td data-label="Details"><a href="\${item.details}" target="_blank" rel="noopener">Details</a></td>
          <td data-label="Register"><a href="\${item.register}" target="_blank" class="btn per-row-register">Register</a></td>\`;
        tableBody.appendChild(tr);
      });
    }

    function filterRows() {
      const selected = venueSelect.value;
      tableBody.querySelectorAll('tr').forEach(row => {
        row.style.display = (selected === 'all' || row.dataset.venue === selected) ? '' : 'none';
      });
    }

    fetch(csvUrl)
      .then(res => res.text())
      .then(csv => {
        const data = parseCSV(csv);
        populateTable(data);
        filterRows();
      })
      .catch(err => console.error('Error loading schedule:', err));

    venueSelect.addEventListener('change', filterRows);
  });
</script>
</body>
</html>
