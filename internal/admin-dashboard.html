<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>EasyLatih Admin Dashboard</title>

<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;padding:20px}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{background:#0d3b66;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}
.kpi-card{background:white;padding:20px;border-radius:12px;text-align:center}
.kpi-card h1{color:#0d3b66;margin:10px 0}
table{width:100%;border-collapse:collapse;background:white}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}
th{background:#0d3b66;color:white}
</style>
</head>

<body>

<div class="top">
  <h2>EasyLatih Admin Dashboard</h2>
  <button onclick="location.href='agent-dashboard.html'">Back to Agent Dashboard</button>
</div>

<div class="kpi">
  <div class="kpi-card">
    <h3>Total Prospects</h3>
    <h1 id="totalProspects">0</h1>
  </div>

  <div class="kpi-card">
    <h3>HRD Levy</h3>
    <h1 id="levy">0</h1>
  </div>

  <div class="kpi-card">
    <h3>Non Levy</h3>
    <h1 id="nonLevy">0</h1>
  </div>

  <div class="kpi-card">
    <h3>Total Agents</h3>
    <h1 id="totalAgents">0</h1>
  </div>
</div>

<div class="card">
  <h3>Agent Ranking</h3>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Agent ID</th>
        <th>Agent Name</th>
        <th>Total Prospects</th>
        <th>HRD Levy</th>
        <th>Non Levy</th>
      </tr>
    </thead>
    <tbody id="agentTable"></tbody>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyX3OgRmpJTxaMITi2TPaOIz2LE6czbG9WUes0s_4dD5AVDl0xim8gZx0YINN1Qn9TG/exec";

async function loadAdminDashboard(){
  const response = await fetch(`${API_URL}?action=adminDashboard`);
  const data = await response.json();

  if(!data.success){
    alert("Cannot load admin dashboard");
    return;
  }

  document.getElementById("totalProspects").innerHTML = data.totalProspects;
  document.getElementById("levy").innerHTML = data.levy;
  document.getElementById("nonLevy").innerHTML = data.nonLevy;
  document.getElementById("totalAgents").innerHTML = data.agents.length;

  let html = "";

  data.agents.forEach((a, index) => {
    html += `
      <tr>
        <td>${index + 1}</td>
        <td>${a.agentId}</td>
        <td>${a.agentName}</td>
        <td>${a.prospects}</td>
        <td>${a.levy}</td>
        <td>${a.nonLevy}</td>
      </tr>
    `;
  });

  document.getElementById("agentTable").innerHTML = html;
}

loadAdminDashboard();
</script>

</body>
</html>
